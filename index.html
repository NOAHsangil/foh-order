<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="seed.js"></script>
<script>
/* Firebase(Firestore) 저장소 어댑터 — 앱이 쓰는 db / downloads 인터페이스를 Firestore로 연결 */
(function(){
  if (window.claude) return;
  const KEYS = ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'];
  function setMsg(html){ const el=document.getElementById('app'); if(el) el.innerHTML='<div class="card"><div class="empty">'+html+'</div></div>'; }
  async function loadConfig(){
    const res = await fetch('firebase-config.js?v=' + Date.now(), {cache:'no-store'});
    if (!res.ok) throw new Error('firebase-config.js 를 찾지 못했습니다');
    const t = (await res.text()).replace(/\/\*[\s\S]*?\*\//g,'').replace(/(^|[^:])\/\/.*$/gm,'$1'); const cfg = {};
    for (const k of KEYS){ const m = t.match(new RegExp(k + '\\s*["\']?\\s*:\\s*["\']([^"\']+)["\']')); if (m) cfg[k] = m[1]; }
    if (!cfg.apiKey || !cfg.projectId || cfg.apiKey.includes('여기')) throw new Error('firebase-config.js 에 Firebase 설정값을 붙여넣어 주세요');
    return cfg;
  }
  async function seedIfEmpty(db){
    if (!window.SEED) return;
    const flag = await db.doc('meta/seeded').get();
    if (flag.exists) return;
    const cfg = await db.doc('config/main').get();
    if (cfg.exists) { await db.doc('meta/seeded').set({at: new Date().toISOString(), skipped: true}); return; }
    setMsg('처음 실행 · 기존 데이터를 옮기는 중입니다… (10초 정도)');
    for (let i = 0; i < window.SEED.length; i += 400){
      const b = db.batch();
      for (const [p, d] of window.SEED.slice(i, i + 400)) b.set(db.doc(p), d);
      await b.commit();
    }
    await db.doc('meta/seeded').set({at: new Date().toISOString(), count: window.SEED.length});
  }
  let dbp = null;
  function getDb(){
    if (dbp) return dbp;
    dbp = (async () => {
      try {
        const cfg = await loadConfig();
        firebase.initializeApp(cfg);
        const db = firebase.firestore();
        try { db.settings({ ignoreUndefinedProperties: true, merge: true }); } catch(e) {}
        try { await db.enablePersistence({ synchronizeTabs: true }); } catch(e) {}
        await seedIfEmpty(db);
        return db;
      } catch (e) {
        console.warn(e);

<script>
/* 발주 계산 엔진 — 엑셀 오토발주와 같은 규칙 */
const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
function addDays(id, n) {
  const [y, m, d] = id.split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1, d + n));
  return t.toISOString().slice(0, 10);
}
function mondayOf(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const w = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - w);
  const p = (x) => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function num(v) { return (v === null || v === undefined || v === '' || isNaN(Number(v))) ? null : Number(v); }
function ceilTo(x, m) { m = Math.max(1, m || 1); return x <= 1e-9 ? 0 : Math.ceil(x / m - 1e-9) * m; }
function itemRate(it, settings) {
  const dr = num(it.directRate);
  if (dr !== null && dr > 0) return dr;
  const mu = num(it.monthUse), ms = num(settings.monthSales);
  return (mu && ms) ? mu / ms * 1e6 : 0;
}

/* ctx: {weekId, todayId, settings, vendors:{id:v}, items:[...active], weekDocs:{wid:doc}, entries:{wid:{itemId:entry}}} */
function computeWeek(ctx) {
  const { weekId, todayId, settings } = ctx;
  const W = ctx.weekDocs[weekId] || {};
  const NWid = addDays(weekId, 7), PWid = addDays(weekId, -7);
  const NW = ctx.weekDocs[NWid] || {};
  const E = ctx.entries[weekId] || {}, PE = ctx.entries[PWid] || {};

  const monInc = !!settings.monInc;
  const sales = [];

    if (d <= 7) sales[d] = num((W.sales || [])[d - 1]) || 0;
    else {
      const v = num((NW.sales || [])[d - 8]);
      sales[d] = v !== null ? v : (num((W.sales || [])[d - 8]) || 0);
    }
  }
  const out = {};
  for (const it of ctx.items) {
    const v = ctx.vendors[it.vendorId] || { sched: [null, null, null, null, null, null] };
    const ent = E[it.id] || {};
    const pent = PE[it.id] || {};
    const rate = itemRate(it, settings);
    const use = [0]; for (let d = 1; d <= 14; d++) use[d] = rate * sales[d] / 1e6;
    const off = [], hol = [], A = [];
    for (let b = 0; b < 6; b++) {
      const o = num((v.sched || [])[b]);
      off[b] = o;
      A[b] = o === null ? null : b + 1 + o;
      let h = false;
      if (o !== null) {
        if (((W.hol || {})[it.vendorId] || [])[b]) h = true;
        const hd = v.holDates || [];
        if (hd.includes(addDays(weekId, b)) || hd.includes(addDays(weekId, b + o))) h = true;
        if (num(v.nthWeek) && v.nthDay) {

        }

    }
    // carry-over arrivals (지난주 발주분)
    const carry = new Array(16).fill(0);
    const manual = ent.arr || [];
    if (num(manual[0]) !== null || num(manual[1]) !== null) {

    } else {

    // 입고 후에 센 재고: 그날 입고분은 이미 재고에 들어있음 → 다시 더하지 않음
    const incDay = (d) => monInc && d <= 6 && stockIn[d] !== null;

    const rec = [], used = [], P = [], cov = [], NA = [], past = [];

    const Kday = [];

      past[b] = addDays(weekId, b) < todayId;
      let K = null; for (let d = 1; d <= b + 1; d++) if (stockIn[d] !== null) K = d;
      Kday[b] = K;

      const noStock = K === null;
      if (noStock) K = 1;
      const start = stockIn[K] || 0;

      for (let d = K; d < A[b]; d++) { if (!(d === K && incDay(K))) arr += carry[d]; us += use[d] || 0; }
      for (let bp = 0; bp < b; bp++) if (A[bp] !== null && A[bp] >= K && A[bp] < A[b] && !(A[bp] === K && incDay(K))) arr += used[bp];
      P[b] = Math.max(0, start + arr - us);
      let na = null;
      for (let bp = b + 1; bp < 6; bp++) if (off[bp] !== null && !hol[bp]) { na = A[bp]; break; }

      else rec[b] = ceilTo(Math.max(0, c * safety - P[b]), mult);
      used[b] = hol[b] ? 0 : (conf[b] !== null ? conf[b] : 0); // 입력한(확정된) 발주만 입고 예상에 더함
    }
    const open = [0], arrD = [0], close = [0], after = [0];
    for (let d = 1; d <= 14; d++) {
      let a = carry[d];
      for (let b = 0; b < 6; b++) if (A[b] === d) a += used[b];
      arrD[d] = a;
      if (firstK === null || d < firstK) { open[d] = null; close[d] = null; after[d] = null; continue; }

      const add = incDay(d) ? 0 : a;
      close[d] = Math.max(0, open[d] + add - (use[d] || 0));

    }

      red: [1, 2, 3, 4, 5, 6].map(d => after[d] !== null && after[d] < (use[d] || 0) - 1e-9), hasMon: stockIn[1] !== null,
      hasStock: firstK !== null, firstK, Kday };
  }
  return { sales, out };
}

function holCalendar(vid){

  const hd=new Set(v.holDates||[]);
  const [y,m]=S.holMonth.split('-').map(Number);
  const first=new Date(y,m-1,1),days=new Date(y,m,0).getDate();const lead=first.getDay();
  const p=x=>String(x).padStart(2,'0');

  for(let d=1;d<=days;d++){const id=`${y}-${p(m)}-${p(d)}`;const dt=new Date(y,m-1,d);const wd=DN[(dt.getDay()+6)%7];

function prevMonthId(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
async function importSubul(file){
  if(!window.XLSX){toast('엑셀 읽기 도구를 불러오지 못했습니다');return}
  try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    let map=null;const N=v=>Number(v)||0;
    const norm=v=>String(v==null?'':v).replace(/\s/g,'');
    const names=wb.SheetNames.slice().sort((x,y)=>(norm(y).includes('수불')?1:0)-(norm(x).includes('수불')?1:0));
    for(const name of names){const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
      let hi=-1,cc=-1;for(let i=0;i<Math.min(rows.length,40)&&hi<0;i++){const r=rows[i]||[];for(let j=0;j<r.length;j++)if(norm(r[j])==='품목코드'||norm(r[j])==='상품코드'){hi=i;cc=j;break}}
      if(hi<0)continue;
      // 헤더 두 줄(구분/수량·금액)에서 열 찾기, 못 찾으면 표준 위치(품목코드 기준 오프셋)
      const h1=(rows[hi]||[]).map(norm),h2=(rows[hi+1]||[]).map(norm);
      const grp=k=>{let last='';const out=[];for(let j=0;j<Math.max(h1.length,h2.length);j++){if(h1[j])last=h1[j];out[j]=last}return out.findIndex((x,j)=>x.includes(k)&&(h2[j]==='수량'||h2[j]===''))};
      const col=(k,off)=>{const j=grp(k);return j>=0?j:cc+off};
      const cUse=col('사용출고',15),cIn=col('일반입고',7),cTin=col('이체입고',9),cTout=col('이체출고',11);
      const isAmt=j=>h2[j+1]==='금액';
      map={};let cnt=0;
      for(const r of rows.slice(hi+1)){const c=r&&r[cc];if(c==null||c===''||!/^\d+$/.test(String(c).trim()))continue;cnt++;
        map[String(c).trim()]={use:N(r[cUse]),useAmt:isAmt(cUse)||cUse===cc+15?N(r[cUse+1]):0,inQty:N(r[cIn]),inAmt:isAmt(cIn)||cIn===cc+7?N(r[cIn+1]):0,tIn:N(r[cTin+1]),tOut:N(r[cTout+1])}}
      if(cnt)break;map=null}
    if(!map){toast('수불현황에서 "품목코드" 칸을 찾지 못했습니다. 영업시스템 수불현황 엑셀인지 확인해 주세요');return}
    const mon=S.settings.subulMonth||prevMonthId();
    let n=0;const missing=[];
    for(const it of S.catalog){const c=String(it.code||'').trim();const m=c&&map[c];
      if(m){n++;const d=Object.assign({},it,{sub:{month:mon,inQty:m.inQty,inAmt:m.inAmt,useAmt:m.useAmt,tIn:m.tIn,tOut:m.tOut,use:m.use}});if(!isManual(it))d.monthUse=m.use;await setDoc(`catalog/${it.id}`,d)}
      else{if(it.sub){const d=Object.assign({},it);delete d.sub;await setDoc(`catalog/${it.id}`,d)}
        if(!isManual(it)&&it.active!==false&&(it.directRate==null||it.directRate==='')&&(it.minStock==null||it.minStock===''))missing.push(it.name||it.code||'')}}
    await setDoc('config/main',Object.assign({},S.settings,{subulAt:todayId,subulFile:file.name,subulMatched:n,subulMissing:missing,subulMonth:mon}));
    toast(`${n}개 품목 사용량·입고 금액 갱신 · 그달 총매출도 확인하세요`);
  }catch(err){console.warn(err);toast('파일을 읽지 못했습니다')}
}
function vendorSheet(v,R,items){
  const wk=S.view, days=[0,1,2,3,4,5], sched=v.sched||[];
  const title=`${v.name} 발주표 · ${md(wk)}(월) ~ ${md(addDays(wk,5))}(토)`;
  const head=['품목코드','품목명','규격','단위','단가'];
  days.forEach(b=>head.push(`${DN[b]} ${md(addDays(wk,b))}`));head.push('수량 합계','발주 금액');
  const arrRow=['','입고일','','',''];
  const r0=items.length?R.out[items[0].id]:null;
  days.forEach(b=>{const o=sched[b];if(o==null||o===''){arrRow.push('발주 없음');return}
    if(r0&&r0.hol[b]){arrRow.push('휴무');return}const ad=addDays(wk,b+Number(o));const dt=new Date(ad+'T00:00:00');arrRow.push(`${'월화수목금토일'[(dt.getDay()+6)%7]} ${md(ad)} 입고`)});
  arrRow.push('','');
  const rows=[[title],[`받은 날 ${todayId} · 금액 = 내 발주 수량 × 단가 (부가세 별도) · ※ 참고용 자료입니다. 실제 발주는 영업시스템에 직접 넣으세요.`],head,arrRow];
  const dayAmt=days.map(()=>0);let tot=0,totQ=0;
  for(const it of items){const o=R.out[it.id];const pr=Number(it.price)||0;let q=0,amt=0;
    const r=[Number(it.code)||it.code||'',it.name||'',it.spec||'',it.unit||'',pr];
    for(const b of days){if(o.off[b]==null){r.push('');continue}if(o.hol[b]){r.push('휴무');continue}
      const c=o.conf[b];r.push(c==null||c===0?'':c);if(c){q+=c;amt+=c*pr;dayAmt[b]+=c*pr}}
    r.push(q||'',amt?Math.round(amt):'');tot+=amt;totQ+=q;rows.push(r)}
  rows.push([]);
  rows.push(['','요일별 발주 금액','','',''].concat(days.map(b=>dayAmt[b]?Math.round(dayAmt[b]):'')).concat(['',Math.round(tot)]));
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:11},{wch:30},{wch:16},{wch:6},{wch:9}].concat(Array(6).fill({wch:11})).concat([{wch:9},{wch:12}]);
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:12}},{s:{r:1,c:0},e:{r:1,c:12}}];
  const lastR=rows.length-1;
  for(const k of Object.keys(ws)){if(k[0]==='!')continue;const a=XLSX.utils.decode_cell(k);if(typeof ws[k].v==='number'&&(a.c===4||a.c===12||a.r===lastR))ws[k].z='#,##0'}
  return {ws,dayAmt,tot};
}
function sheetName(n,used){let b=String(n).replace(/[\\\/\?\*\[\]:]/g,'').slice(0,28)||'업체';let x=b,i=2;while(used.has(x))x=b+'_'+(i++);used.add(x);return x}
async function exportXlsx(which){
  if(!window.XLSX||!S.dl){toast('이 화면에서는 파일 받기를 쓸 수 없습니다');return}
  const R=calc(S.view),all=activeItems();
  const vs=Object.values(S.vendors).sort((a,b)=>(a.order??99)-(b.order??99)).filter(v=>all.some(it=>it.vendorId===v.id));
  const pick=which==='*'?vs:vs.filter(v=>v.id===which);
  if(!pick.length){toast('받을 업체가 없습니다');return}
  const wb=XLSX.utils.book_new();const used=new Set();const sum=[];const sheets=[];
  for(const v of pick){const {ws,dayAmt,tot}=vendorSheet(v,R,all.filter(it=>it.vendorId===v.id));sum.push([v.name].concat(dayAmt.map(x=>x?Math.round(x):'')).concat([Math.round(tot)]));sheets.push([v.name,ws])}
  if(which==='*'){
    const head=['업체'].concat([0,1,2,3,4,5].map(b=>`${DN[b]} ${md(addDays(S.view,b))}`)).concat(['주간 합계']);
    const totals=[0,1,2,3,4,5,6].map(i=>sum.reduce((s,r)=>s+(Number(r[i+1])||0),0));
    const rows=[[`발주 금액 요약 · ${md(S.view)}(월) ~ ${md(addDays(S.view,5))}(토)`],[`받은 날 ${todayId} · 내 발주 수량 × 단가 (부가세 별도)`],head].concat(sum).concat([[],['합계'].concat(totals.map(x=>x?Math.round(x):''))]);
    const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:22}].concat(Array(7).fill({wch:12}));
    Object.keys(ws).forEach(k=>{if(k[0]!=='!'&&typeof ws[k].v==='number')ws[k].z='#,##0'});
    XLSX.utils.book_append_sheet(wb,ws,sheetName('요약',used))}
  for(const [n,ws] of sheets)XLSX.utils.book_append_sheet(wb,ws,sheetName(n,used));
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const fname=which==='*'?`발주표_전체_${S.view}.xlsx`:`발주표_${String(pick[0].name).replace(/[\\\/\?\*\[\]:㈜()]/g,'')}_${S.view}.xlsx`;
  try{await S.dl.save({filename:fname,data:new Uint8Array(buf)});toast('파일을 저장했습니다')}
  catch(e){if(e&&e.code==='declined')return;toast('파일을 저장하지 못했습니다')}
}

/* ---------- 온세 엑셀 연동 ---------- */
const BLK=['K','O','S','W','AA','AE'],CONFC=['N','R','V','Z','AD','AH'];
function serialToId(v){if(typeof v!=='number')return null;const c=XLSX.SSF.parse_date_code(v);if(!c)return null;const p=x=>String(x).padStart(2,'0');return `${c.y}-${p(c.m)}-${p(c.d)}`}
function cv(ws,a){const c=ws&&ws[a];return c?c.v:undefined}
function nn(v){if(v===undefined||v===null||v==='')return null;const n=Number(v);return isNaN(n)?null:n}
const vnorm=t=>String(t||'').replace(/\s|㈜|\(주\)|\(유\)|주식회사|유한회사/g,'').toLowerCase();
function findVendor(name){const n=vnorm(name);if(!n)return null;return Object.values(S.vendors).find(v=>vnorm(v.name)===n)||null}
async function readOnse(file){
  if(!window.XLSX){toast('엑셀 읽기 도구를 불러오지 못했습니다');return}
  let wb;try{wb=XLSX.read(await file.arrayBuffer(),{type:'array'})}catch(e){toast('파일을 읽지 못했습니다');return}
  const O=wb.Sheets['오토발주'];if(!O){toast('오토발주 시트가 없습니다. 오토발주 엑셀 파일인지 확인하세요');return}
  const VS=wb.Sheets['업체 설정'];const gen=!!VS;
  const title=String(cv(O,'A1')||'').replace(/^오토발주\s*/,'').replace(/\s*\(.*\)\s*$/,'').trim();
  const imp={file:file.name,gen,title:gen?(title||'새 묶음'):'온세',weekId:serialToId(cv(O,'C3')),safety:nn(cv(O,'C4')),items:[],entries:[],vendors:[],sales:[],next:[],monthSales:null,subul:{},log:{},actual:{},setSched:false};
  if(!imp.weekId){toast('주 시작일(C3)을 읽지 못했습니다');return}
  if(gen){for(let r=5;r<=30;r++){const name=cv(VS,'B'+r);if(name==null||name==='')continue;
      const sched=['C','D','E','F','G','H'].map(c=>nn(cv(VS,c+r)));
      imp.vendors.push({name:String(name).trim(),sched,nthWeek:nn(cv(VS,'I'+r)),nthDay:cv(VS,'J'+r)||null,hol:['M','N','O','P','Q','R'].map(c=>cv(VS,c+r)==='휴무')})}}
  else imp.vendors.push({name:(S.vendors.onse||{}).name||'온세물류',onse:true,hol:BLK.map(col=>cv(O,col+'6')==='휴무')});
  const M=wb.Sheets['품목 관리'];
  if(M){for(let r=5;r<=200;r++){
      const g=gen?{vn:cv(M,'C'+r),code:cv(M,'D'+r),name:cv(M,'E'+r),spec:cv(M,'F'+r),unit:cv(M,'G'+r),price:cv(M,'H'+r),mult:cv(M,'I'+r),dr:cv(M,'J'+r),ms:cv(M,'K'+r),mq:cv(M,'L'+r)}
                 :{vn:null,code:cv(M,'C'+r),name:cv(M,'D'+r),spec:cv(M,'E'+r),unit:cv(M,'F'+r),price:cv(M,'G'+r),mult:cv(M,'H'+r),dr:cv(M,'I'+r),ms:cv(M,'J'+r),mq:cv(M,'K'+r)};
      if(g.code==null||g.code==='')continue;
      imp.items.push({vn:g.vn?String(g.vn).trim():imp.vendors[0].name,code:String(g.code).trim(),active:String(cv(M,'B'+r)||'').toUpperCase()==='O',name:g.name||'',spec:g.spec||'',unit:g.unit||'',price:nn(g.price),mult:nn(g.mult)||1,directRate:nn(g.dr),minStock:nn(g.ms),minQty:nn(g.mq)})}}
  for(let r=9;r<=90;r++){const code=cv(O,'A'+r);if(typeof code!=='number'&&!(typeof code==='string'&&/^\d+$/.test(code)))continue;const c=String(code);
    const vn=gen?String(cv(O,'C'+r)||'').trim():imp.vendors[0].name;
    if(!M) imp.items.push({vn,code:c,active:true,name:cv(O,'B'+r)||'',spec:'',unit:cv(O,'D'+r)||'',price:nn(cv(O,'E'+r)),mult:nn(cv(O,'F'+r))||1,directRate:nn(cv(O,'G'+r)),minStock:nn(cv(O,'AL'+r)),minQty:nn(cv(O,'AM'+r))});
    const e={vn,code:c,stock:BLK.map(col=>nn(cv(O,col+r))),conf:CONFC.map(col=>nn(cv(O,col+r))),arr:[nn(cv(O,'I'+r)),nn(cv(O,'J'+r))]};
    if(e.stock.some(x=>x!=null)||e.conf.some(x=>x!=null)||e.arr.some(x=>x))imp.entries.push(e)}
  const SA=wb.Sheets['매출 입력'];
  if(SA){imp.monthSales=nn(cv(SA,'D4'));for(let k=0;k<7;k++)imp.sales[k]=nn(cv(SA,'E'+(7+k)));for(let k=0;k<7;k++)imp.next[k]=nn(cv(SA,'E'+(14+k)))}
  const SB=wb.Sheets['수불현황'];
  if(SB){const rows=XLSX.utils.sheet_to_json(SB,{header:1,raw:true});for(const r of rows){if(r&&r[3]!=null&&/^\d+$/.test(String(r[3]).trim()))imp.subul[String(r[3]).trim()]=Number(r[18])||0}}
  const LG=wb.Sheets['주간 기록'];
  if(LG){for(let r=5;r<=3000;r++){const w=serialToId(cv(LG,'A'+r)),code=cv(LG,'B'+r);
      if(w&&code!=null&&w!==imp.weekId){const s=nn(cv(LG,'D'+r));if(s!=null)(imp.log[w]=imp.log[w]||{})[String(code)]=s}
      const ow=serialToId(cv(LG,'O'+r));if(ow){const a=nn(cv(LG,'Q'+r));if(a!=null)imp.actual[ow]=a}
      if(!w&&!ow&&r>40&&cv(LG,'A'+r)==null&&cv(LG,'O'+r)==null)break}}
  S.imp=imp;render();setTimeout(()=>document.getElementById('onsex')?.scrollIntoView({block:'start'}),50);
}
function impVendorId(i,vn){const v=findVendor(vn);if(v)return v.id;if(!i.gen&&S.vendors.onse)return 'onse';return null}
function impPreview(){const i=S.imp;
  const vrows=i.vendors.map(v=>{const ex=i.gen?findVendor(v.name):(S.vendors.onse||findVendor(v.name));return `<span><b>${esc(v.name)}</b> ${ex?'':'<span class="pill warn">새 업체</span>'}</span>`}).join('');
  const nNew=i.items.filter(x=>!findItem(x.code,impVendorId(i,x.vn))).length;

    <div class="meta" style="font-size:calc(13px*var(--fz,1));color:var(--ink)"><span>형식 <b>${i.gen?'여러 업체 ('+esc(i.title)+')':'온세'}</b></span><span>주 시작일 <b class="num">${i.weekId}</b></span>
    <span>품목 <b class="num">${i.items.length}</b>개 (사용 ${i.items.filter(x=>x.active).length}, 새 품목 ${nNew})</span><span>재고·내 발주 입력된 품목 <b class="num">${i.entries.length}</b></span>
    <span>매출 <b class="num">${i.sales.filter(x=>x!=null).length}</b>일</span><span>수불현황 <b class="num">${Object.keys(i.subul).length}</b>개 코드</span><span>주간 기록 <b class="num">${Object.keys(i.log).length}</b>주</span></div>
    <div class="meta" style="font-size:calc(13px*var(--fz,1));color:var(--ink);margin-top:6px">${vrows}</div>
    ${i.gen?`<label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:calc(13px*var(--fz,1))"><input type="checkbox" data-impsched ${i.setSched?'checked':''}> 업체 발주 요일·정기휴무도 엑셀대로 바꾸기 (체크 안 하면 앱 설정 유지)</label>`:''}
    <p class="note">반영하면 같은 업체·품목코드의 품목 정보와 이 주(${md(i.weekId)}~)의 재고·내 발주·매출·휴무가 엑셀 값으로 바뀝니다. 앱에만 있는 품목은 그대로 둡니다.</p>
    <div class="ctrl"><button class="btn pri" data-impgo>앱에 반영</button><button class="btn" data-impcancel>취소</button></div></div>`}
function findItem(code,vid){code=String(code||'').trim();if(!code)return null;
  const same=S.catalog.filter(x=>String(x.code||'').trim()===code);
  return (vid&&same.find(x=>x.vendorId===vid))||(same.length===1&&(!vid||!S.vendors[same[0].vendorId])?same[0]:null)||(!vid&&same[0])||null}
async function applyOnse(){
  const i=S.imp;toast('반영하는 중…');
  // vendors
  const vmap={};let vo=Object.keys(S.vendors).length;
  for(const v of i.vendors){let ex=v.onse?(S.vendors.onse||findVendor(v.name)):findVendor(v.name);
    if(!ex){const id='v'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);ex={id,name:v.name,sched:v.sched||[null,null,null,null,null,null],nthWeek:v.nthWeek??null,nthDay:v.nthDay??null,order:++vo,group:i.gen?i.title:null,holDates:[]};await setDoc(`vendors/${id}`,ex)}
    else if(i.gen&&i.setSched){ex=Object.assign({},ex,{sched:v.sched,nthWeek:v.nthWeek??null,nthDay:v.nthDay??null});await setDoc(`vendors/${ex.id}`,ex)}
    vmap[vnorm(v.name)]=ex.id;v.id=ex.id}
  const vidOf=vn=>vmap[vnorm(vn)]||impVendorId(i,vn)||i.vendors[0].id;
  await setDoc('config/main',Object.assign({},S.settings,{safety:i.safety??S.settings.safety,monInc:S.settings.monInc,monthSales:i.monthSales??S.settings.monthSales}));
  const kOf={};const idOf={};
  for(const it of i.items){const vid=vidOf(it.vn);kOf[vid]=(kOf[vid]||0)+1;const ex=findItem(it.code,vid);
    let id=ex?ex.id:it.code;if(!ex&&S.catalog.some(x=>x.id===id))id=it.code+'-'+vid;
    const d=Object.assign({},ex||{id,vendorId:vid},{code:it.code,name:it.name,spec:it.spec,unit:it.unit,price:it.price,mult:it.mult,directRate:it.directRate,minStock:it.minStock,minQty:it.minQty,active:it.active,order:kOf[vid]});
    if(it.code in i.subul&&!(S.vendors[vid]||{}).manual)d.monthUse=i.subul[it.code];
    await setDoc(`catalog/${id}`,d);idOf[it.code+'|'+vid]=id;if(!S.catalog.some(x=>x.id===id))S.catalog.push(d)}
  await setWeek(i.weekId,w=>{const s=(w.sales||[]).slice();for(let b=0;b<7;b++)if(i.sales[b]!=null)s[b]=i.sales[b];w.sales=s;w.hol=w.hol||{};for(const v of i.vendors)if(v.hol)w.hol[v.id]=v.hol.slice()});
  if(i.next.some(x=>x!=null)){const nid=addDays(i.weekId,7);await setWeek(nid,w=>{const s=(w.sales||[]).slice();i.next.forEach((v,b)=>{if(v!=null&&(s[b]==null||s[b]===''))s[b]=v});w.sales=s})}
  for(const e of i.entries){const vid=vidOf(e.vn);const id=idOf[e.code+'|'+vid]||findItem(e.code,vid)?.id||e.code;
    try{const cur=await S.db.doc(`weeks/${i.weekId}/items/${id}`).get();const c=cur.exists?JSON.parse(JSON.stringify(cur.data())):{};
      c.stock=e.stock;c.conf=e.conf;if(e.arr.some(x=>x))c.arr=e.arr;await S.db.doc(`weeks/${i.weekId}/items/${id}`).set(c)}catch(err){writeFail(err)}}
  const vids=new Set(i.vendors.map(v=>v.id));
  for(const [w,m] of Object.entries(i.log)){for(const [code,s] of Object.entries(m)){
      const cand=S.catalog.filter(x=>String(x.code||'').trim()===code&&vids.has(x.vendorId));if(cand.length!==1)continue;const id=cand[0].id;
    try{const ref=S.db.doc(`weeks/${w}/items/${id}`);const cur=await ref.get();const c=cur.exists?JSON.parse(JSON.stringify(cur.data())):{};
      if(!(c.stock&&c.stock[0]!=null)){c.stock=arrSet(c.stock,0,s);await ref.set(c)}}catch(err){writeFail(err)}}}
  for(const [w,a] of Object.entries(i.actual)){const cur=S.weeks[w]||{};if(cur.actual==null)await setWeek(w,x=>{x.actual=a})}
  S.imp=null;S.view=i.weekId;subEntries();render();toast('엑셀 내용을 앱에 반영했습니다');
}
async function exportXl(group){
  if(!window.XLSX||!S.dl){toast('이 화면에서는 파일 받기를 쓸 수 없습니다');return}
  const vs=Object.values(S.vendors).sort((a,b)=>(a.order??99)-(b.order??99)).filter(v=>vGroup(v)===group);
  if(!vs.length){toast('업체가 없습니다');return}
  const onse=vs.some(v=>v.id==='onse')&&vs.length===1;const vset=new Set(vs.map(v=>v.id));
  const R=calc(S.view),items=activeItems().filter(it=>vset.has(it.vendorId)),W=S.weeks[S.view]||{},NW=S.weeks[addDays(S.view,7)]||{};
  const fileName=onse?'온세 파일':`${group} 파일`;
  const wb=XLSX.utils.book_new();
  // 1) 오토발주
  const A=[];const put=(r,c,v)=>{A[r]=A[r]||[];A[r][c]=v};const col=s=>XLSX.utils.decode_col(s);
  put(0,0,`앱 → ${fileName} 오토발주 (주 시작일 ${S.view})`);
  put(1,0,`붙여넣는 방법: 이 시트의 K9부터 AH까지 품목 줄을 복사 → ${fileName} 오토발주 시트 K9 선택 → 선택하여 붙여넣기 → "값" + "내용 있는 셀만 붙여넣기(빈 셀 무시)" 체크.`);
  put(2,0,'먼저 A열 품목코드 순서가 엑셀 파일 오토발주 시트와 같은지 확인하세요. 다르면 품목 관리 순서를 맞춘 뒤 붙여넣으세요.');
  put(7,0,'품목코드');put(7,1,'품목명');if(!onse)put(7,2,'업체');BLK.forEach((c,b)=>{put(7,col(c),`${DN[b]} 실재고`);put(7,col(CONFC[b]),`${DN[b]} 확정`)});
  items.forEach((it,i)=>{const r=8+i;const o=R.out[it.id];put(r,0,Number(it.code)||it.code);put(r,1,it.name);if(!onse)put(r,2,(S.vendors[it.vendorId]||{}).name||'');
    BLK.forEach((c,b)=>{if(o.stockIn[b+1]!=null)put(r,col(c),o.stockIn[b+1])});CONFC.forEach((c,b)=>{if(o.conf[b]!=null)put(r,col(c),o.conf[b])})});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(A),'오토발주 붙여넣기');
  // 2) 매출 입력
  const nN=onse?2:7;const B=[];const putB=(r,c,v)=>{B[r]=B[r]||[];B[r][c]=v};
  putB(0,1,`붙여넣는 방법: D4와 E7:E${13+nN}를 복사 → ${fileName} 매출 입력 시트 같은 칸에 "값"으로 붙여넣기`);
  putB(3,1,'기준월 매출');putB(3,3,S.settings.monthSales??'');
  for(let k=0;k<7+nN;k++){putB(6+k,1,k<7?'이번 주':'다음 주');putB(6+k,2,DN[k%7]);const v=k<7?(W.sales||[])[k]:(NW.sales||[])[k-7];putB(6+k,4,v??'')}
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(B),'매출 입력 붙여넣기');
  // 3) 업체 휴무 (여러 업체 형식)
  if(!onse){const H=[['붙여넣는 방법: M5부터 R열까지 복사 → 업체 설정 시트 M5에 "값"으로 붙여넣기 (업체 순서가 같은지 먼저 확인)'],[],[],['','업체','','','','','','','','','','','월','화','수','목','금','토']];
    const r0=calc(S.view);vs.forEach(v=>{const it=items.find(x=>x.vendorId===v.id);const o=it?r0.out[it.id]:null;const row=['',v.name,'','','','','','','','','',''];
      for(let b=0;b<6;b++)row.push(o&&o.hol[b]&&(v.sched||[])[b]!=null?'휴무':'');H.push(row)});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(H),'업체 설정 붙여넣기')}
  // 4) 주간 기록
  const L=[[`붙여넣는 방법: 3행부터 복사 → ${fileName} 주간 기록 시트의 마지막 줄 아래(A열)에 "값"으로 붙여넣기`],['주 시작일','품목코드','품목명','월요일 재고','입고 합계','예상 사용량','발주 합계','실제 사용량','실제 매출 기준 예상','오차율','실제 100만원당']];
  const weeks=Object.keys(S.entries).filter(w=>w<=S.view).sort();
  for(const w of weeks){const r=calc(w);const nr=calc(addDays(w,7));const act=Number((S.weeks[w]||{}).actual)||0;
    for(const it of items){const o=r.out[it.id];if(!o||!o.hasMon)continue;const no=nr.out[it.id];
      const row=[w,Number(it.code)||it.code,it.name,o.stockIn[1],Math.round(o.weekArr*100)/100,Math.round(o.weekUse*10)/10,o.used.reduce((s,x)=>s+x,0)];
      if(no&&no.hasMon&&act){const u=o.stockIn[1]+o.weekArr-no.stockIn[1];const ex=o.rate*act/1e6;row.push(Math.round(u*10)/10,Math.round(ex*10)/10,ex?Math.round((u-ex)/ex*100)/100:'',Math.round(u/act*1e6*1000)/1000)}
      L.push(row)}}
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(L),'주간 기록 붙여넣기');
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  try{await S.dl.save({filename:`앱_${String(group).replace(/[\\\/\?\*\[\]:]/g,'')}형식_${S.view}.xlsx`,data:new Uint8Array(buf)});toast('파일을 저장했습니다')}catch(e){if(e&&e.code==='declined')return;toast('파일을 저장하지 못했습니다')}
}

render();
(async()=>{
  const db=window.claude?await window.claude.use('db'):null;
  if(!db){$('#app').innerHTML='<div class="card"><div class="empty">저장소에 연결하지 못했습니다.</div></div>';return}

  db.doc('config/main').onSnapshot(s=>{S.settings=Object.assign({safety:1.2,monInc:true},s.exists?s.data():{});S.ready.cfg=true;schedule()},onErr);
  db.collection('vendors').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=Object.assign({id:d.id},d.data()));S.vendors=m;S.ready.ven=true;schedule()},onErr);
  db.collection('catalog').onSnapshot(s=>{S.catalog=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));S.ready.cat=true;schedule()},onErr);
  db.collection('weeks').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.weeks=m;S.ready.wk=true;schedule()},onErr);
  subEntries();
})();
